name: Security – Cross-company isolation

# Blocks merges when a migration introduces a cross-company (multi-tenant)
# data-isolation leak in its RLS policies.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/check-cross-company-security.mjs"
      - ".github/workflows/security-cross-company.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  cross-company-check:
    name: Cross-company isolation check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run cross-company security guard
        run: node scripts/check-cross-company-security.mjs
